<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appartment building</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="houseFormContainer">
      <h1>Create house</h1>
      <form id="houseForm">
        <label for="quantityOfFlats">
          Enter quantity of flats
          <input
            id="quantityOfFlats"
            name="quantityOfFlats"
            type="number"
            required
          />
        </label>

        <label for="numberOfResidents">
          Enter quantity of residents in each flat
          <input
            id="numberOfResidents"
            name="numberOfResidents"
            type="number"
            required
          />
        </label>
        <button id="createHouseBtn" type="submit">Create House</button>
      </form>
    </div>

    <div id="apartmentsFormContainer"></div>
    <div id="resultContainer"></div>
    <div id="housesList"></div>

    <script src="./index.js"></script>
  </body>
</html>

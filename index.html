<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <table>
      <caption>
        Application for users
      </caption>

      <thead>
        <tr>
          <th>Full name</th>
          <th>E-mail</th>
          <th>Read</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="user-table"></tbody>
    </table>

    <form id="user-form">
      <label for="user-name"
        >Full name
        <input id="user-name" type="text" name="user-name" required />
      </label>

      <label for="user-email"
        >E-mail
        <input id="user-email" name="user-email" type="email" required />
      </label>
      <button type="submit" id="button-submit">Save user</button>
    </form>

    <script src="./index.js"></script>
  </body>
</html>

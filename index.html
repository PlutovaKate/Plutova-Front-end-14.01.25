<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
    <h1>Registration form</h1>

    <form action="/signup" method="get">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="surname">Surname</label>
      <input type="text" id="surname" name="surname" required />

      <label for="birthday">Date of birth</label>
      <input type="text" id="birthday" name="Date of birth" required />

      <p>Select your gender:</p>
      <div>
        <input type="radio" name="gender" value="male" id="male" />
        <label for="male">Male</label>
      </div>
      <div>
        <input type="radio" name="gender" value="Female" id="female" />
        <label for="female">Female</label>
      </div>

      <label for="city">Choose your city:</label>
      <select id="city" name="city" size="4" multiple>
        <option value="dnipro">Dnipro</option>
        <option value="kyiv">Kyiv</option>
        <option value="lviv">Lviv</option>
        <option value="odessa">Odessa</option>
      </select>

      <label for="address">Enter your address:</label>
      <textarea id="address" name="message" rows="10" cols="30"> </textarea>

      <p>Select your languages:</p>
      <label for="Ukrainian">
        <input
          type="checkbox"
          name="language"
          value="ukrainian"
          id="Ukrainian"
        />Ukrainian</label
      >
      <label for="English"
        ><input type="checkbox" name="language" value="English" id="English" />
        English</label
      >
      <label for="German"
        ><input
          type="checkbox"
          name="language"
          value="German"
          id="German"
        />German</label
      >
      <label for="Poland"
        ><input
          type="checkbox"
          name="language"
          value="Poland"
          id="Poland"
        />Poland</label
      >

      <label for="email">Enter your example.com email:</label>

      <input
        type="email"
        id="email"
        pattern=".+@example\.com"
        size="30"
        required
      />

      <br>
      <input type="submit">Submit</input>
    </form>
  </div>

  

    <script src="./index.js"></script>
  </body>
</html>
